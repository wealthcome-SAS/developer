                        - master
                        - doctorate
                      occupation:
                        type: string
                        nullable: true
                      occupationWording:
                        type: string
                        nullable: true
                      retirementAge:
                        type: number
                        nullable: true
                      annualIncome:
                        anyOf:
                        - type: string
                        - type: number
                        - nullable: true
                      heritageOrigin:
                        type: string
                        nullable: true
                      seniorAdvisor:
