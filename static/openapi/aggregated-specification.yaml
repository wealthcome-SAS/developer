                    type: string
                  secondaryActivities:
                    type: string
                  clients:
                    type: string
                  suppliers:
                    type: string
                  competitors:
                    type: string
          - nullable: true
          description: |-
            General information about the entity
             This field is treated as a scalar
        details:
          type: object
          nullable: true
          properties:
            street:
              type: string
              nullable: true
            zipCode:
              type: string
              nullable: true
            city:
              type: string
              nullable: true
            addressSupplement:
              type: string
              nullable: true
            workStreet:
              type: string
              nullable: true
            workZipCode:
              type: string
              nullable: true
            workCity:
              type: string
              nullable: true
            workAddressSupplement:
              type: string
              nullable: true
            otherStreet:
              type: string
              nullable: true
            otherZipCode:
              type: string
              nullable: true
            otherCity:
              type: string
              nullable: true
            otherAddressSupplement:
              type: string
              nullable: true
            firstPhoneNumber:
              type: string
              nullable: true
            secondPhoneNumber:
              type: string
              nullable: true
            personalEmail:
              type: string
              nullable: true
            otherEmail:
              type: string
              nullable: true
            fiscalAddress:
              type: string
              nullable: true
            country:
              type: string
              nullable: true
            otherCountry:
              type: string
              nullable: true
            workCountry:
              type: string
              nullable: true
          description: |-
            Detailed information about the entity
             This field is treated as a scalar
        type:
          type: string
          nullable: true
          enum:
          - person
          - company
        assets:
          type: array
          items:
            type: object
            properties:
              ownership:
                type: number
              id:
                type: string
                format: uuid
            required:
            - ownership
            - id
          description: Assets (partially or fully) owned by the entity
        providers:
          type: object
          nullable: true
          additionalProperties:
            type: array
            items:
              type: string
          description: Provider IDs associated with the entity. This field contains a mapping where each key represents a provider name and the value is an array of provider-specific IDs for this entity. This data comes from the funnel.entities.provider_ids column.
          example:
            provider1:
            - id1
            - id2
            provider2:
            - id3
      required:
      - id
      - name
      - updated
      - assets
    Manager:
      type: object
      properties:
        id:
          type: string
          example: adfdfaca-48f0-4f3b-b30a-c6d97293090c
        name:
          type: string
          example: Jean dupont
        email:
          type: string
          example: jean.dupont@company.tld
      required:
      - id
      - name
      - email
    Asset:
      type: object
      properties:
        id:
          type: string
          description: The unique identifier of the asset
          example: adfdfaca-48f0-4f3b-b30a-c6d97293090c
        name:
          type: string
          description: The name of the asset
          example: Jean dupont
        group:
          type: string
          enum:
          - banking
          - securities
          - lifeInsurance_capitalization
          - retirement_employee
          - crowdfunding
          - private_equity
          - crypto
          - benefits
          - heritage_real_estate
          - professional_real_estate
          - commercial_real_estate
          - other
          - rock_paper
          - exotic
          - home_loan
          - business_loan
          - consumer_loan
          - other_loan
          - unrecognized
          description: The group of the asset. Note that the group will determine the structure of the asset's metadata
          example: banking
        BBAN:
          type: string
          nullable: true
          description: The BBAN of the asset
        management:
          type: string
          enum:
          - under
          - none
          description: The management of the asset, under if the assets is managed by the company, otherwise none
        distribution:
          type: array
          items:
            type: object
            properties:
              ownership:
                type: number
              entityId:
                type: string
                format: uuid
            required:
            - ownership
            - entityId
            description: the distribution of ownership shares between entities
        providers:
          type: object
          nullable: true
          additionalProperties:
            type: string
          description: Provider IDs associated with the asset. Each key represents a provider name and the value is the provider-specific ID for this asset.
          example:
            provider1: id1
            provider2: id2
      required:
      - id
      - name
      - group
      - management
      - distribution
    Transaction:
      type: object
      properties:
        id:
          type: string
          description: The unique identifier of the transaction
          example: tx-123456-abcdef
        name:
          type: string
          description: The name/description of the transaction
          example: Payment for services
        date:
          type: string
          nullable: true
          description: The date of the transaction.
          example: 2024-03-15
        amount:
          type: number
          description: The amount of the transaction (in EUR)
          example: 1250.5
        type:
          type: string
          description: The type of the transaction
          example: payment
        processed:
          type: string
          description: The date when the transaction was last processed by the system
        manager:
          type: object
          nullable: true
          properties:
            id:
              type: string
              example: adfdfaca-48f0-4f3b-b30a-c6d97293090c
            name:
              type: string
              example: Jean dupont
          required:
          - id
          - name
          description: The manager linked to the transaction
      required:
      - id
      - name
      - date
      - amount
      - type
      - processed
    Investment:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: The unique identifier of the investment
          example: inv-123456-abcdef
        label:
          type: string
          description: The label/name of the investment
          example: APPLE INC
        unitPrice:
          type: number
          description: The price per unit
          example: 150.25
        unitValue:
          type: number
          description: The current value per unit
          example: 155.75
        quantity:
          type: number
          description: The number of units held
          example: 100
        valuation:
          type: number
          description: The total valuation of the investment
          example: 15575
        instrument:
          type: string
          description: The type of investment instrument
          example: Stock
        category:
          type: string
          description: The investment category
          example: Equity
        subcategory:
          type: string
          description: The investment subcategory
          example: Technology
        managementCompany:
          type: string
          description: The company managing the investment
          example: BlackRock
        riskIndicator:
          type: string
          description: Risk indicator of the investment
          example: Moderate
        sri:
          type: string
          description: Synthetic Risk Indicator
          example: '4'
      required:
      - id
      - label
      - unitPrice
      - unitValue
      - quantity
      - valuation
      - instrument
      - category
      - subcategory
      - managementCompany
      - riskIndicator
      - sri
    Parent Company:
      type: object
      properties:
        id:
          type: string
          format: uuid
          example: adfdfaca-48f0-4f3b-b30a-c6d97293090c
        name:
          type: string
          example: Apple Paris
        created:
          type: string
          nullable: true
          readOnly: true
        updated:
          type: string
          nullable: true
      required:
      - id
      - name
      - created
      - updated
  parameters: {}
paths:
