  /parent-companies/{parentCompanyID}/references:
    get:
      operationId: references_list
      tags:
      - Reference
      summary: List of reference
      parameters:
      - schema:
          type: number
          nullable: true
          default: 0
          minimum: 0
          example: 0
        required: false
        name: offset
        in: query
      - schema:
          type: number
          nullable: true
          default: 10
          minimum: 1
          example: 10
        required: false
        name: limit
        in: query
      - schema:
          type: string
          nullable: true
          description: Filter customers created after this date
          example: 2024-01-01T00:00:00.000Z
        required: false
        name: creation_from
        in: query
      - schema:
          type: string
          nullable: true
          description: Filter customers created before this date
          example: 2024-01-01T00:00:00.000Z
        required: false
        name: creation_to
        in: query
      - schema:
          type: string
          nullable: true
          enum:
          - customer
          - prospect
          - relation
          description: Filter to show only references containing prospects
          example: prospect
        required: false
        name: type
        in: query
      responses:
        '200':
          description: success - paginated list of customers
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    id:
                      type: string
                      format: uuid
                      description: The references ID.
                    companyId:
                      type: string
                      format: uuid
                      description: The company in which the reference is part of.
                    created:
                      type: string
                      nullable: true
                      description: The date of creation of the reference.
                      example: 2024-01-01T00:00:00.000Z
                    tag:
