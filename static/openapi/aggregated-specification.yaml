                type: object
                nullable: true
                properties:
                  lastNameFirstName:
                    type: string
                  function:
                    type: string
                  birthDate:
                    type: string
                    nullable: true
                  nationality:
                    type: string
                  personalAddress:
                    type: string
                  personalPhoneNumber:
                    type: string
                  personalEmailAddress:
                    type: string
                  shareholderInformation:
                    type: string
                  idCard:
                    type: string
