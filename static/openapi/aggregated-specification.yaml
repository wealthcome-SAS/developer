                    type: number
                    minimum: 0
                    example: 10
                required:
                - count
  /companies/{company-id}/references:
    get:
      operationId: references_list
      tags:
      - Reference
      summary: List of reference
      parameters:
      - schema:
          type: number
          nullable: true
          default: 0
          minimum: 0
          example: 0
        required: false
        name: offset
        in: query
      - schema:
          type: number
          nullable: true
          default: 10
          minimum: 1
          example: 10
        required: false
        name: limit
        in: query
      - schema:
          type: string
          nullable: true
          description: Filter customers created after this date
          example: 2024-01-01T00:00:00.000Z
        required: false
        name: creation_from
        in: query
      - schema:
          type: string
          nullable: true
          description: Filter customers created before this date
          example: 2024-01-01T00:00:00.000Z
        required: false
        name: creation_to
        in: query
      responses:
        '200':
          description: success - paginated list of customers
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    id:
                      type: string
                      format: uuid
                      description: The references ID.
                    companyId:
                      type: string
                      format: uuid
                      description: The company in which the reference is part of.
                    created:
                      type: string
                      nullable: true
                      description: The date of creation of the reference.
                      example: 2024-01-01T00:00:00.000Z
                    tag:
                      type: string
                      nullable: true
                      description: The tag of the reference.
                      example: VIP
                    entities:
                      type: array
                      items:
                        type: object
                        properties:
                          id:
                            type: string
                            nullable: true
                            format: uuid
                            description: The ID of the aggregation entity.
                            example: e1f2d3c4-b5a6-7b8c-9d0e-f1a2b3c4d5e6
                          type:
                            type: string
                            nullable: true
                            enum:
                            - customer
                            - prospect
                            - relation
                            description: The type of the aggregation entity.
                            example: customer
                    access:
                      type: array
                      items:
                        type: object
                        properties:
                          managerId:
                            type: string
                            format: uuid
                            description: The ID of the manager who has access to the reference.
                            example: e1f2d3c4-b5a6-7b8c-9d0e-f1a2b3c4d5e6
                          primary:
                            type: boolean
                            default: false
                            description: Whether the manager is the primary contact for the reference.
                            example: true
                        required:
                        - managerId
                  required:
                  - id
                  - companyId
                  - created
                  - entities
                  - access
                  description: A "customer" reference is like a folder containing one or more aggregations entities
