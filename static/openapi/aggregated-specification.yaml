  /parent-companies/{parentCompanyID}/references/{reference-id}:
    get:
      operationId: references_informations
      tags:
      - Reference
      summary: Reference information
      parameters:
      - schema:
          type: string
          format: uuid
          description: The ID of the reference to retrieve
          example: e1f2d3c4-b5a6-7b8c-9d0e-f1a2b3c4d5e6
        required: true
        name: reference-id
        in: path
      responses:
        '200':
          description: success - a reference information
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: string
                    format: uuid
                    description: The references ID.
                  companyId:
                    type: string
                    format: uuid
                    description: The company in which the reference is part of.
                  created:
                    type: string
                    nullable: true
                    description: The date of creation of the reference.
                    example: 2024-01-01T00:00:00.000Z
                  tag:
                    type: string
                    nullable: true
                    description: The tag of the reference.
                    example: VIP
                  entities:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: string
                          nullable: true
                          format: uuid
                          description: The ID of the aggregation entity.
                          example: e1f2d3c4-b5a6-7b8c-9d0e-f1a2b3c4d5e6
                        type:
                          type: string
                          nullable: true
                          enum:
                          - customer
                          - prospect
                          - relation
                          description: The type of the aggregation entity.
                          example: customer
                  access:
                    type: array
                    items:
                      type: object
                      properties:
                        managerId:
                          type: string
                          format: uuid
                          description: The ID of the manager who has access to the reference.
                          example: e1f2d3c4-b5a6-7b8c-9d0e-f1a2b3c4d5e6
                        primary:
                          type: boolean
                          default: false
                          description: Whether the manager is the primary contact for the reference.
                          example: true
                      required:
                      - managerId
                required:
                - id
                - companyId
                - created
                - entities
                - access
                description: A "customer" reference is like a folder containing one or more aggregations entities
